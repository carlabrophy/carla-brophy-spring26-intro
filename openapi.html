<!doctype html>
<html lang="en">
  <head>
    <title>Carla Brophy's Portfolio</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/openapi.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <img
        id="profile-photo"
        src="./images/image.jpg"
        alt="Carla Brophy's photo"
      />
      <h1>Carla Brophy</h1>
      <nav id="nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#connect">Connect</a></li>
          <li><a href="#leaveMessage">Leave a Message</a></li>
          <li><a href="openapi.html">Portfolio</a></li>
        </ul>
      </nav>
    </header>

    <hr />

    <section id="openApi">
      <h2>Random Cat Image</h2>

      <div id="catHolder"></div>

      <form id="getCatImageForm">
        <input type="button" value="Get Cat Image" id="getImage" />
      </form>

      <h2>Random Cat Breed Facts</h2>

      <div id="breedHolder"></div>

      <form id="getBreedForm">
        <input type="button" value="Get Cat Breed" id="getBreed" />
      </form>
    </section>

    <hr />

    <section id="leaveMessage">
      <h2>Leave a Message</h2>
      <form action="" name="leave_message">
        <label for="usersName">Name:</label>
        <input type="text" name="usersName" id="usersName" required />
        <br />

        <label for="usersEmail">Email:</label>
        <input type="email" name="usersEmail" id="usersEmail" required />
        <br />

        <label for="usersMessage">Message:</label>
        <textarea name="usersMessage" id="usersMessage" required></textarea>
        <br />
        <button type="submit">Submit</button>
      </form>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="js/openapi.js"></script>
  </body>
</html>
